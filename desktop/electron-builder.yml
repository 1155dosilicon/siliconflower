appId: com.siliconflower.desktop
productName: Siliconflower
directories:
  # Not the default "build": that is where desktop/build.ts writes the bundle.
  buildResources: resources
  output: ../dist-desktop
files:
  - build/**/*
  - package.json
electronLanguages:
  - pt-BR
  - en-US
# Turns off what would let someone use the installed app to run other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# The agent goes outside the asar: an executable cannot run from inside an archive.
win:
  target: nsis
  icon: resources/icon.ico
  extraResources:
    - from: ../dist/siliconflower.exe
      to: siliconflower.exe
linux:
  target: AppImage
  icon: resources/icon.png
  category: Development
  executableName: siliconflower-desktop
  # Links the running window to the .desktop entry (WM_CLASS / Wayland app_id).
  syncDesktopName: true
  artifactName: Siliconflower-${version}-${arch}.${ext}
  extraResources:
    - from: ../dist/siliconflower
      to: siliconflower
nsis:
  # One click, no administrator: installs for the current user only.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Siliconflower
  artifactName: Siliconflower-Setup-${version}.${ext}
  # Recent projects stay, as a later reinstall expects.
  deleteAppDataOnUninstall: false
