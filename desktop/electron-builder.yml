appId: com.siliconflower.desktop
productName: Siliconflower
directories:
  # Not the default "build": that is where desktop/build.ts writes the bundle.
  buildResources: resources
  output: ../dist-desktop
files:
  - build/**/*
  - package.json
electronLanguages:
  - pt-BR
  - en-US
# Turns off what would let someone use the installed app to run other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# The agent goes outside the asar: an executable cannot run from inside an archive.
win:
  target: nsis
  icon: resources/icon.ico
  extraResources:
    - from: ../dist/siliconflower.exe
      to: siliconflower.exe
linux:
  # AppImage: runs anywhere, or per-user with scripts/install-appimage.sh. deb: system-wide
  # install for Debian/Ubuntu/elementary, with menu entry, icon and setuid chrome-sandbox,
  # and no FUSE.
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
  executableName: siliconflower-desktop
  # Debian wants "Name <email>". Public: it goes into every .deb.
  maintainer: silicon <redesneural@yahoo.com>
  # Links the running window to the .desktop entry (WM_CLASS / Wayland app_id).
  syncDesktopName: true
  artifactName: Siliconflower-${version}-${arch}.${ext}
  extraResources:
    - from: ../dist/siliconflower
      to: siliconflower
nsis:
  # One click, no administrator: installs for the current user only.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Siliconflower
  artifactName: Siliconflower-Setup-${version}.${ext}
  # Recent projects stay, as a later reinstall expects.
  deleteAppDataOnUninstall: false
deb:
  # Installs to /opt/Siliconflower and links /usr/bin/siliconflower-desktop.
  packageCategory: devel
  # electron-builder's default list plus what the Electron binary also links against
  # (libgbm, libasound). On Ubuntu 24.04 the t64 packages provide these names.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2
