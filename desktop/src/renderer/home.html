<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Siliconflower</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="flower.svg" alt="" width="56" height="56">
      <h1>Siliconflower</h1>
      <p>Escolha a pasta em que o agente vai trabalhar.</p>
    </header>
    <button id="pick" class="primary" type="button">Abrir pasta...</button>
    <p id="status" role="status" hidden>Abrindo o projeto...</p>
    <section aria-labelledby="recents-title">
      <h2 id="recents-title">Projetos recentes</h2>
      <p id="empty" hidden>Nenhum projeto aberto ainda.</p>
      <ul id="recents"></ul>
    </section>
    <footer>
      <button id="settings" class="link" type="button">Configurações</button>
      <button id="doctor" class="link" type="button" title="Confere se está tudo funcionando" aria-haspopup="dialog"><span aria-hidden="true">🩺</span> Diagnóstico</button>
    </footer>
  </main>

  <dialog id="doctor-dialog" class="doctor" aria-labelledby="doctor-title">
    <div class="doctor-head">
      <h2 id="doctor-title"><span aria-hidden="true">🩺</span> Diagnóstico</h2>
      <button id="doctor-close" type="button" class="doctor-close" aria-label="Fechar o diagnóstico">×</button>
    </div>
    <p id="doctor-summary" class="doctor-summary" role="status"></p>
    <ul id="doctor-list" class="doctor-list"></ul>
    <div class="doctor-actions">
      <button id="doctor-fix" type="button" class="primary" hidden title="Só faz o que não perde dados: nada é apagado">Corrigir o que der</button>
      <button id="doctor-again" type="button">Verificar de novo</button>
    </div>
  </dialog>
</body>
</html>
