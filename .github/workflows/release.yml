# Pushing a tag vX.Y.Z builds the agent and the desktop app on each system and attaches
# them to a draft release. Review the draft and publish it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            agent: dist/siliconflower.exe
            agent_name: siliconflower-portatil-windows-x64.exe
            app: dist-desktop/Siliconflower-Setup-*.exe
            extra: ""
          - os: ubuntu-latest
            dist: dist:linux
            agent: dist/siliconflower
            agent_name: siliconflower-portatil-linux-x64
            app: dist-desktop/Siliconflower-*.AppImage dist-desktop/Siliconflower-*.deb
            extra: scripts/install-appimage.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Tag matches the version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG
        shell: bash
        run: bun scripts/release-notes.ts "${GITHUB_REF_NAME}" > release-notes.md

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd desktop --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run typecheck:desktop
          bun test

      - name: Build agent
        run: bun run build

      - name: Build desktop app
        run: bun run --cwd desktop ${{ matrix.dist }}

      - name: Collect files
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.agent }}" "upload/${{ matrix.agent_name }}"
          cp ${{ matrix.app }} upload/
          if [ -n "${{ matrix.extra }}" ]; then cp ${{ matrix.extra }} upload/; fi

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: upload/*
