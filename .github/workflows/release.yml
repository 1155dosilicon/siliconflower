# Pushing a tag vX.Y.Z builds the agent and the desktop app on each system and attaches
# them to a draft release. Review the draft and publish it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            agent: dist/siliconflower.exe
            agent_name: siliconflower.exe
            app: dist-desktop/Siliconflower-Setup-*.exe
          - os: ubuntu-latest
            dist: dist:linux
            agent: dist/siliconflower
            agent_name: siliconflower-linux-x64
            app: dist-desktop/Siliconflower-*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Tag matches the version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd desktop --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run typecheck:desktop
          bun test

      - name: Build agent
        run: bun run build

      - name: Build desktop app
        run: bun run --cwd desktop ${{ matrix.dist }}

      - name: Collect files
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.agent }}" "upload/${{ matrix.agent_name }}"
          cp ${{ matrix.app }} upload/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: upload/*
