name: Pedido de recurso
description: Uma ideia para o Siliconflower
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina a solução
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
